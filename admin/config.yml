backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "Products"
    files:
      - name: "products"
        label: "All Products"
        file: "data/products.json"
        description: "Add, edit, or remove products shown on the website. Only fill in the fields that apply to this product — leave Sizes/Dimensions blank if not relevant, for example."
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            label_singular: "Product"
            summary: "{{title}} — {{category}}"
            fields:
              - { label: "Product Name", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Couvres-lit", value: "couvres-lit" }
                  - { label: "Couvertures", value: "couvertures" }
                  - { label: "Draps", value: "draps" }
                  - { label: "Tapis", value: "tapis" }
                  - { label: "Rideaux", value: "rideaux" }
                  - { label: "Serviettes", value: "serviettes" }
              - { label: "Price (e.g. 349 MAD)", name: "price", widget: "string" }
              - label: "Photos (add as many as you want)"
                name: "images"
                widget: "list"
                fields:
                  - { label: "Photo", name: "src", widget: "image" }
              - { label: "Short Description (shown on the product card)", name: "short_description", widget: "string", required: false }
              - { label: "Full Description", name: "description", widget: "text", required: false }
              - label: "Colors Available (add one at a time, leave empty if none)"
                name: "colors"
                widget: "list"
                required: false
                field: { label: "Color", name: "value", widget: "string" }
              - label: "Sizes Available (add one at a time, leave empty if none)"
                name: "sizes"
                widget: "list"
                required: false
                field: { label: "Size", name: "value", widget: "string" }
              - { label: "Dimensions (e.g. 150 x 200 cm — leave empty if not applicable)", name: "dimensions", widget: "string", required: false }
              - { label: "Stock quantity (optional, leave empty to hide)", name: "stock", widget: "number", required: false, value_type: "int" }
              - { label: "Mark as Featured", name: "featured", widget: "boolean", required: false, default: false }
              - { label: "Mark as New", name: "is_new", widget: "boolean", required: false, default: false }
              - { label: "Mark as On Sale", name: "on_sale", widget: "boolean", required: false, default: false }
